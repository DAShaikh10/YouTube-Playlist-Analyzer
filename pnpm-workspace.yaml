overrides:
  js-yaml: '>=4.1.1'
  # next 16.2.11 pins postcss 8.4.31, which is affected by GHSA-r28c-9q8g-f849,
  # GHSA-qx2v-qp2m-jg93 and GHSA-6g55-p6wh-862q (all fixed in 8.5.18).
  # Pinned exactly so the override does not pull a release that is younger than
  # the dependency cooldown; bump manually alongside the Dependabot cadence.
  postcss: 8.5.19
  # next 16.2.11 pins sharp ^0.34.5, whose bundled libvips is affected by
  # GHSA-f88m-g3jw-g9cj (CVE-2026-33327/33328/35590/35591, patched in sharp
  # >=0.35.0); 0.35.3 ships @img/sharp-libvips-* 1.3.2 = libvips 8.18.3.
  # 0.35 is a breaking release but next only calls resize/rotate/avif/jpeg/
  # png/webp/timeout/toBuffer, none of which it removed. It also drops sharp's
  # install script, so the allowBuilds entry below is now a no-op for sharp.
  # Pinned exactly for the same cooldown reason as postcss above.
  sharp: 0.35.3
allowBuilds:
  sharp: false
  unrs-resolver: false
onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - sharp
  - unrs-resolver
